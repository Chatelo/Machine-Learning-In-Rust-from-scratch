[package]
name = "rust-ml-step-by-step"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
csv = "1"
linfa = "0.8.1"
linfa-linear = "0.8.1"
linfa-logistic = "0.8.1"
ndarray = { version = "0.16", features = ["serde"] }
polars = "0.55.2"
rand = "0.9"
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
